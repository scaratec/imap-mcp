name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Keep in sync with the ruff-pre-commit rev in .pre-commit-config.yaml.
      # An unpinned ruff picks up new default rules on its own.
      - run: pip install ruff==0.17.3
      - run: ruff check src/
      - run: ruff format --check src/

  # mypy is currently tracking a known backlog of typing debt (see the
  # mypy_debt.md note in docs/ — TODO once the file is added). The job
  # is informational so the release gate is not held hostage by it, but
  # the output is visible on every push so the debt cannot grow silently.
  # When the backlog is resolved, drop `continue-on-error` and tighten
  # the invocation back to `--check-untyped-defs`.
  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy --check-untyped-defs src/imap_mcp/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with requires-python and the classifiers in
        # server/pyproject.toml.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/policy/ -q
