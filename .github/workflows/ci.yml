name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Keep in sync with the ruff-pre-commit rev in .pre-commit-config.yaml.
      # An unpinned ruff picks up new default rules on its own.
      - run: pip install ruff==0.17.3
      - run: ruff check src/
      - run: ruff format --check src/

  # Strict mode comes from [tool.mypy] in server/pyproject.toml. The
  # tracing extra is installed so that opentelemetry resolves. mypy is
  # pinned for the same reason as ruff: a new release must not turn CI
  # red on code nobody touched.
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,tracing]" mypy==2.4.1
      - run: mypy src/imap_mcp/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with requires-python and the classifiers in
        # server/pyproject.toml.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/policy/ -q
